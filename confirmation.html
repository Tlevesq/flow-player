<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Adresse confirmée · Flow Pole &amp; Yoga</title>
<!--
  Page d'atterrissage des liens de confirmation d'adresse e-mail :
    confirmation.html?token_hash=…&type=signup        (création de compte)
    confirmation.html?token_hash=…&type=email_change  (changement d'adresse)
  Le lien est vérifié auprès de Supabase, puis la page invite à ouvrir l'app.
  Accepte aussi l'ancien format de lien (#access_token=…).
-->
<style>
  :root { --fond: #fff4e8; --encre: #1c1c2e; --sourd: #6b6478; --cuivre: #b8743b; --carte: #fffaf4; --ligne: #e9d9c8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--encre); font: 17px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 20px 60px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 30px; margin: 0 0 6px; }
  .marque { color: var(--cuivre); font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 26px; }
  .carte { background: var(--carte); border: 1px solid var(--ligne); border-radius: 18px; padding: 28px 24px; text-align: center; }
  .coche { font-size: 52px; color: var(--cuivre); }
  .info { color: var(--sourd); font-size: 15px; }
  .erreur { color: #b3261e; }
  footer { margin-top: 28px; font-size: 13px; color: var(--sourd); text-align: center; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="marque">Flow Pole &amp; Yoga</div>
  <h1 id="titre">Un instant…</h1>
  <div class="carte">
    <div id="coche" class="coche" style="display:none">✓</div>
    <p id="message" class="info">Vérification du lien…</p>
  </div>
  <footer>Un souci ? <a href="support.html">Page d'aide</a> · <a href="mailto:flowpoleandyoga@gmail.com">flowpoleandyoga@gmail.com</a></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  var URL_SUPABASE = "https://camneizjfaxohbogympv.supabase.co";
  var CLE_PUBLIQUE = "sb_publishable_Ub7eOBqw6b9OM7EwLmyqoA_g8Ht4Y5S";
  var client = supabase.createClient(URL_SUPABASE, CLE_PUBLIQUE, { auth: { detectSessionInUrl: true, flowType: "implicit" } });

  var titre = document.getElementById("titre");
  var message = document.getElementById("message");
  var coche = document.getElementById("coche");

  function reussite(type) {
    titre.textContent = type === "email_change" ? "Nouvelle adresse confirmée" : "Adresse confirmée";
    coche.style.display = "block";
    message.textContent = "Tu peux fermer cette page, ouvrir l'app Flow Pole & Yoga et te connecter.";
    client.auth.signOut({ scope: "local" });
  }

  function echec() {
    titre.textContent = "Lien expiré";
    message.className = "erreur";
    message.textContent = "Ce lien n'est plus valable : il expire au bout d'une heure et ne sert qu'une fois. Reconnecte-toi dans l'app pour recevoir un nouveau lien, ou écris-nous.";
  }

  async function initialiser() {
    var hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    if (hash.get("error")) { echec(); return; }
    var query = new URLSearchParams(location.search);
    var tokenHash = query.get("token_hash");
    var type = query.get("type") || "signup";
    if (tokenHash) {
      var verif = await client.auth.verifyOtp({ token_hash: tokenHash, type: type });
      if (verif.error) { echec(); return; }
      reussite(type);
      return;
    }
    var session = await client.auth.getSession();
    if (session.data && session.data.session) reussite(hash.get("type") || type);
    else echec();
  }

  initialiser();
})();
</script>
</body>
</html>
